
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Based Spam Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 15px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }
        h1 { text-align: center; color: #1e293b; }
        p { text-align: center; color: #64748b; }
        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Based Spam Classifier</h1>
        <p>Enter a message to check whether it is Spam or Not Spam.</p>

        <form method="POST">
            <textarea name="message" placeholder="Enter your message here..." required>{{ message or '' }}</textarea>
            <button type="submit">Predict Message</button>
        </form>

        {% if result %}
        <div class="result">
            <h2>Prediction: {{ result }}</h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
